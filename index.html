
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cricket Game</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10291d;
  color: white;
  text-align: center;
}
header { padding: 18px 8px; }
h1 { margin: 0 0 12px; color: #ffd54a; }
.scoreboard {
  background: #ffd54a;
  color: #17251c;
  padding: 14px;
  margin: 0 auto 15px;
  max-width: 550px;
  border-radius: 12px;
  font-size: 21px;
  font-weight: bold;
}
.ground {
  position: relative;
  width: min(94%, 600px);
  height: 310px;
  margin: auto;
  overflow: hidden;
  border: 4px solid #b8e6a4;
  border-radius: 50%;
  background: #168449;
}
.pitch {
  position: absolute;
  left: 38%;
  top: 12%;
  width: 24%;
  height: 76%;
  background: #d7b47a;
  border: 2px solid #f6e0b3;
}
.crease {
  position: absolute;
  left: 0;
  width: 100%;
  height: 3px;
  background: white;
}
.top { top: 18%; }
.bottom { bottom: 18%; }
.player {
  position: absolute;
  font-size: 36px;
  z-index: 2;
}
.batsman { left: 44%; bottom: 14%; }
.bowler { right: 44%; top: 12%; }
.ball {
  position: absolute;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #e52e36;
  border: 2px solid white;
  left: 49%;
  top: 25%;
  z-index: 3;
  display: none;
}
.message {
  min-height: 28px;
  color: #ffd54a;
  font-weight: bold;
  margin: 14px 8px;
}
button {
  border: 0;
  border-radius: 9px;
  background: #ffd54a;
  color: #17251c;
  padding: 13px 15px;
  margin: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .4; cursor: default; }
#restart { background: #75c5ff; }
footer { padding: 15px; color: #bdd2c4; }
</style>
</head>
<body>
<header>
  <h1>🏏 MY CRICKET GAME</h1>
  <div class="scoreboard">
    <span id="score">0</span>/<span id="wickets">0</span>
    &nbsp; | &nbsp; Overs: <span id="overs">0.0</span>
  </div>
</header>

<div class="ground">
  <div class="pitch">
    <div class="crease top"></div>
    <div class="crease bottom"></div>
  </div>
  <div class="player bowler">🏃</div>
  <div class="player batsman">🏏</div>
  <div class="ball" id="ball"></div>
</div>

<div class="message" id="message">
  Welcome! Choose your shot.
</div>

<div id="controls">
  <button onclick="play(0)">Dot Ball</button>
  <button onclick="play(1)">1 Run</button>
  <button onclick="play(2)">2 Runs</button>
  <button onclick="play(3)">3 Runs</button>
  <button onclick="play(4)">FOUR</button>
  <button onclick="play(6)">SIX</button>
</div>

<button id="restart" onclick="restart()" hidden>
  Play Again
</button>

<footer>🏆 Score as many runs as you can in 2 overs!</footer>

<script>
let runs = 0;
let wickets = 0;
let balls = 0;
let busy = false;
let finished = false;

const $ = id => document.getElementById(id);

function updateScore() {
  $("score").textContent = runs;
  $("wickets").textContent = wickets;
  $("overs").textContent = Math.floor(balls / 6) + "." + (balls % 6);
}

function play(shot) {
  if (busy || finished) return;
  busy = true;

  document.querySelectorAll("#controls button")
    .forEach(button => button.disabled = true);

  const ball = $("ball");
  ball.style.display = "block";
  ball.style.transition = "none";
  ball.style.left = "49%";
  ball.style.top = "25%";
  ball.style.background = "#e52e36";

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      ball.style.transition = "left 0.45s ease-in, top 0.45s ease-in";
      ball.style.left = "49%";
      ball.style.top = "70%";
    });
  });

  setTimeout(() => {
    balls++;

    if (Math.random() < 0.10) {
      wickets++;
      $("message").textContent = "OUT! The bowler wins this ball!";
    } else {
      runs += shot;
      const messages = {
        0: "Dot ball! Good bowling!",
        1: "Quick single!",
        2: "Great running! Two runs!",
        3: "Excellent running! Three runs!",
        4: "FOUR! Beautiful boundary!",
        6: "SIX! What a massive hit!"
      };
      $("message").textContent = messages[shot];
    }

    updateScore();
    ball.style.display = "none";

    if (wickets >= 10 || balls >= 12) {
      finished = true;
      $("message").textContent =
        "Innings over! Final score: " + runs + "/" + wickets;
      $("restart").hidden = false;
    } else {
      busy = false;
      document.querySelectorAll("#controls button")
        .forEach(button => button.disabled = false);
    }
  }, 500);
}

function restart() {
  runs = 0;
  wickets = 0;
  balls = 0;
  busy = false;
  finished = false;
  updateScore();
  $("message").textContent = "New innings! Choose your shot.";
  $("restart").hidden = true;
  document.querySelectorAll("#controls button")
    .forEach(button => button.disabled = false);
}

updateScore();
</script>
</body>
</html>
